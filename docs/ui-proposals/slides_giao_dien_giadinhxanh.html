<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Đình Xanh — Trình Chiếu Giao Diện & Thư Viện Component (35 Màn Hình)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1B4332;
      --primary-dark: #143326;
      --primary-light: #EBF2EE;
      --accent-warm: #E07A5F;
      --text: #1F2430;
      --text-muted: #64748B;
      --bg: #0F172A;
      --card-bg: #FFFFFF;
      --surface-subtle: #F8F9FA;
      --border: #E2E8F0;
      --border-subtle: #F1F5F9;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.15), 0 10px 10px -5px rgba(0,0,0,0.04);
      --radius-pill: 9999px;
      --radius-card: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .top-nav {
      height: 60px;
      background: #111827;
      border-bottom: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #F9FAFB;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: var(--primary);
      color: #A7F3D0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #F3F4F6;
    }

    .brand-sub {
      font-size: 13px;
      color: #9CA3AF;
      display: none;
    }

    @media (min-width: 860px) {
      .brand-sub { display: inline; }
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      background: #1F2937;
      border: 1px solid #374151;
      color: #E5E7EB;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: #374151;
      color: #FFFFFF;
      border-color: #4B5563;
    }

    .btn-nav.active {
      background: var(--primary);
      border-color: #059669;
      color: #FFFFFF;
    }

    .slide-counter {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #E5E7EB;
      background: #1F2937;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-variant-numeric: tabular-nums;
      border: 1px solid #374151;
    }

    /* Main Presentation Container */
    .pres-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      position: relative;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1440px;
      aspect-ratio: 16 / 9;
      min-height: 640px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Slide Header */
    .slide-header {
      padding: 16px 28px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .slide-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .module-pill {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    .pill-auth { background: #FEF3C7; color: #92400E; }
    .pill-customer { background: #EBF2EE; color: #1B4332; }
    .pill-provider { background: #E0E7FF; color: #3730A3; }
    .pill-admin { background: #FEE2E2; color: #991B1B; }
    .pill-appendix { background: #F3E8FF; color: #6B21A8; }
    .pill-architecture { background: #E2E8F0; color: #1E293B; }

    .screen-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-warm);
    }

    .screen-type-badge {
      background: #F1F5F9;
      color: #475569;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .slide-titles-wrap {
      flex: 1;
      min-width: 0;
    }

    .slide-main-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slide-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-badge {
      background: #F8FAFC;
      border: 1px solid var(--border);
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    /* Slide Body Content */
    .slide-body {
      flex: 1;
      padding: 24px 28px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      overflow: hidden;
      background: var(--surface-subtle);
    }

    /* Left Preview Panel */
    .preview-panel {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .preview-header {
      padding: 10px 16px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .preview-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #EF4444; }
    .dot-yellow { background: #F59E0B; }
    .dot-green { background: #10B981; }

    .preview-media {
      flex: 1;
      overflow-y: auto;
      background: #F1F5F9;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      cursor: zoom-in;
    }

    .preview-media img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.2s;
    }

    .preview-media:hover img {
      transform: scale(1.01);
    }

    .preview-overlay-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(4px);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .preview-overlay-btn:hover {
      background: var(--primary);
    }

    /* Right Spec Panel */
    .spec-panel {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 6px;
    }

    .spec-panel::-webkit-scrollbar {
      width: 6px;
    }
    .spec-panel::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }

    .spec-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .spec-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spec-desc {
      font-size: 13px;
      line-height: 1.55;
      color: #334155;
      margin-bottom: 6px;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .db-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      background: #F1F5F9;
      color: #0F172A;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid #E2E8F0;
      font-weight: 500;
    }

    .rls-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      background: #FEF3C7;
      color: #92400E;
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid #FDE68A;
      font-weight: 500;
    }

    .comp-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .comp-list li {
      font-size: 13px;
      color: #334155;
      line-height: 1.45;
      position: relative;
      padding-left: 18px;
    }

    .comp-list li::before {
      content: "•";
      position: absolute;
      left: 4px;
      top: -1px;
      color: var(--primary);
      font-weight: 800;
      font-size: 16px;
    }

    .rule-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rule-list li {
      font-size: 12px;
      color: #475569;
      line-height: 1.45;
      background: #F8FAFC;
      border-left: 3px solid var(--accent-warm);
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
    }

    /* Cover Slide Layout */
    .cover-body {
      flex: 1;
      padding: 48px;
      background: linear-gradient(135deg, #1B4332 0%, #143326 100%);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .cover-body::before {
      content: "";
      position: absolute;
      top: -100px;
      right: -100px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(224, 122, 95, 0.25) 0%, transparent 70%);
      border-radius: 50%;
    }

    .cover-top-badge {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #A7F3D0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .cover-main-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.15;
      margin-top: 24px;
      margin-bottom: 14px;
      color: #FFFFFF;
      max-width: 900px;
    }

    .cover-sub-heading {
      font-size: 20px;
      color: #D1FAE5;
      font-weight: 400;
      max-width: 820px;
      line-height: 1.45;
      margin-bottom: 32px;
    }

    .cover-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: auto;
    }

    .cover-kpi-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
    }

    .cover-kpi-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: #FDE68A;
      margin-bottom: 4px;
    }

    .cover-kpi-label {
      font-size: 13px;
      color: #E2E8F0;
      font-weight: 500;
    }

    /* Architecture Overview Slide */
    .arch-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .arch-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .arch-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .arch-card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .arch-card-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-warm);
      background: #FFF7ED;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    /* Summary Slide Layout */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      height: 100%;
      overflow-y: auto;
    }

    .color-swatch-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .swatch-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #FFFFFF;
    }

    .swatch-color {
      height: 48px;
      width: 100%;
    }

    .swatch-meta {
      padding: 8px;
      font-size: 11px;
    }

    .swatch-hex {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--text);
    }

    .swatch-name {
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 64px;
      background: #111827;
      border-top: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #9CA3AF;
      position: sticky;
      bottom: 0;
      z-index: 50;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1F2937;
      border: 1px solid #374151;
      color: #FFFFFF;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-circle:hover {
      background: var(--primary);
      border-color: #059669;
      transform: scale(1.05);
    }

    .btn-circle:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      background: #1F2937;
      border-color: #374151;
    }

    .progress-bar-wrap {
      flex: 1;
      max-width: 500px;
      margin: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: #1F2937;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10B981 0%, #34D399 100%);
      transition: width 0.25s ease-out;
    }

    .keyboard-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #9CA3AF;
    }

    .kbd {
      background: #1F2937;
      border: 1px solid #374151;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #E5E7EB;
    }

    /* Modal Grid Overview (Drawer) */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .drawer-overlay.open {
      display: flex;
      opacity: 1;
    }

    .drawer-content {
      width: 100%;
      max-width: 1280px;
      margin: 32px auto;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 64px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .drawer-header {
      padding: 16px 24px;
      border-bottom: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #F9FAFB;
    }

    .drawer-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .filter-pills-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 24px;
      background: #0B0F19;
      border-bottom: 1px solid #1F2937;
    }

    .filter-btn {
      background: #1F2937;
      border: 1px solid #374151;
      color: #9CA3AF;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: #374151;
      color: #FFFFFF;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #A7F3D0;
      border-color: #059669;
    }

    .drawer-search-wrap {
      padding: 12px 24px;
      background: #111827;
      border-bottom: 1px solid #1F2937;
    }

    .drawer-search-input {
      width: 100%;
      background: #1F2937;
      border: 1px solid #374151;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .drawer-search-input:focus {
      border-color: #10B981;
    }

    .drawer-grid {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .thumb-card {
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }

    .thumb-card:hover {
      border-color: #10B981;
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .thumb-card.active {
      border: 2px solid #10B981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
    }

    .thumb-img-wrap {
      height: 140px;
      background: #0B0F19;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid #374151;
    }

    .thumb-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .thumb-info {
      padding: 12px;
    }

    .thumb-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-warm);
      margin-bottom: 4px;
    }

    .thumb-title {
      font-size: 13px;
      font-weight: 600;
      color: #F3F4F6;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Lightbox Zoom Modal */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-img-wrap {
      max-width: 95vw;
      max-height: 90vh;
      overflow: auto;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      position: relative;
    }

          </div>
        `;
      } else if (slide.isMatrix) {
        stage.innerHTML = `
          <div class="slide-header">
            <div class="slide-meta">
              <span class="module-pill pill-${slide.moduleTag}">${slide.module}</span>
              <span class="screen-id">${slide.num}</span>
              <span class="screen-type-badge">${slide.type}</span>
            </div>
            <div class="slide-titles-wrap">
              <div class="slide-main-title">${slide.title}</div>
              <div class="slide-subtitle">${slide.subtitle}</div>
            </div>
            <div class="role-badge">Tất cả vai trò</div>
          </div>
          <div class="slide-body" style="grid-template-columns: 1fr; overflow-y:auto; padding:20px 28px;">
            <div style="background:#FFF; border:1px solid var(--border); border-radius:12px; overflow:hidden;">
              <table style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">
                <thead>
                  <tr style="background:#F8FAFC; border-bottom:1px solid var(--border); font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; color:var(--primary);">
                    <th style="padding:10px 14px;">Mã</th>
                    <th style="padding:10px 14px;">Tên Giao Diện / Màn Hình</th>
                    <th style="padding:10px 14px;">Loại</th>
                    <th style="padding:10px 14px;">Phân Hệ</th>
                    <th style="padding:10px 14px;">Bảng Dữ Liệu PostgreSQL</th>
                    <th style="padding:10px 14px; text-align:center;">Hành Động</th>
                  </tr>
                </thead>
                <tbody>
                  ${slides.filter(s => s.image).map((s, idx) => `
                    <tr style="border-bottom:1px solid #F1F5F9; hover:background:#F8FAFC;">
                      <td style="padding:8px 14px; font-family:'IBM Plex Mono', monospace; font-weight:700; color:var(--accent-warm);">${s.num}</td>
                      <td style="padding:8px 14px; font-weight:600; color:var(--text);">${s.title}</td>
                      <td style="padding:8px 14px;"><span class="screen-type-badge">${s.type}</span></td>
                      <td style="padding:8px 14px;"><span class="module-pill pill-${s.moduleTag}" style="font-size:10px;">${s.module.replace('PHÂN HỆ ', '')}</span></td>
                      <td style="padding:8px 14px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:#475569;">${s.dbTables ? s.dbTables.join(', ') : 'N/A'}</td>
                      <td style="padding:8px 14px; text-align:center;">
                        <button onclick="goToSlide(${slides.indexOf(s)})" style="background:var(--primary); color:#FFF; border:none; padding:4px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:600; cursor:pointer;">Xem Slide →</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (slide.isSummary) {
        stage.innerHTML = `
          <div class="slide-header">
            <div class="slide-meta">
              <span class="module-pill pill-${slide.moduleTag}">${slide.module}</span>
              <span class="screen-id">${slide.num}</span>
              <span class="screen-type-badge">${slide.type}</span>
            </div>
            <div class="slide-titles-wrap">
              <div class="slide-main-title">${slide.title}</div>
              <div class="slide-subtitle">${slide.subtitle}</div>
            </div>
            <div class="role-badge">Design System</div>
          </div>
          <div class="slide-body" style="grid-template-columns: 1fr;">
            <div class="summary-grid">
              <div class="spec-card">
                <div class="spec-title">🎨 Bảng Màu Chuẩn (Warm Minimalism Color Palette)</div>
                <div class="color-swatch-list">
                  ${slide.designTokens.colors.map(c => `
                    <div class="swatch-item">
                      <div class="swatch-color" style="background:${c.hex};"></div>
                      <div class="swatch-meta">
                        <div class="swatch-hex">${c.hex}</div>
                        <div class="swatch-name">${c.name}</div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="spec-card">
                <div class="spec-title">🔤 Hệ Thống Chữ Viết (Typography)</div>
                <div style="display:flex; flex-direction:column; gap:10px;">
                  ${slide.designTokens.typography.map(t => `
                    <div style="padding:10px; background:#F8FAFC; border-radius:8px; border:1px solid #E2E8F0;">
                      <div style="font-size:12px; font-weight:700; color:var(--primary); text-transform:uppercase;">${t.role}</div>
                      <div style="font-size:14px; font-weight:600; color:var(--text); margin:2px 0;">${t.font}</div>
                      <div style="font-size:12px; color:var(--text-muted);">${t.style}</div>
                    </div>
                  `).join('')}
                </div>
                <div class="spec-title" style="margin-top:16px;">🔘 Quy Cách Bo Góc (Border Radius)</div>
                <div style="display:flex; gap:10px;">
                  ${slide.designTokens.shapes.map(s => `
                    <div style="flex:1; padding:10px; background:#F8FAFC; border-radius:8px; border:1px solid #E2E8F0;">
                      <div style="font-size:12px; font-weight:700; color:var(--accent-warm);">${s.name}</div>
                      <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600;">${s.radius}</div>
                      <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${s.usage}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Standard Screen Slide (35 Screens)
        stage.innerHTML = `
          <div class="slide-header">
            <div class="slide-meta">
              <span class="module-pill pill-${slide.moduleTag}">${slide.module}</span>
              <span class="screen-id">${slide.num}</span>
              <span class="screen-type-badge">${slide.type}</span>
            </div>
            <div class="slide-titles-wrap">
              <div class="slide-main-title">${slide.title}</div>
              <div class="slide-subtitle">${slide.subtitle}</div>
            </div>
            <div class="role-badge">${slide.role}</div>
          </div>

          <div class="slide-body">
            <!-- Left Preview -->
            <div class="preview-panel">
              <div class="preview-header">
                <div class="preview-dots">
                  <span class="dot dot-red"></span>
                  <span class="dot dot-yellow"></span>
                  <span class="dot dot-green"></span>
                </div>
                <div>Retina 2x UI Capture · ${slide.image || ''}</div>
              </div>
              <div class="preview-media" onclick="openLightbox('anh-giao-dien-du-an/${slide.image}')">
                <img src="anh-giao-dien-du-an/${slide.image}" alt="${slide.title}" loading="lazy">
                <button class="preview-overlay-btn" onclick="event.stopPropagation(); openLightbox('anh-giao-dien-du-an/${slide.image}')">
                  🔍 Phóng to ảnh gốc
                </button>
              </div>
            </div>

            <!-- Right Specifications -->
            <div class="spec-panel">
              <!-- Purpose -->
              <div class="spec-card">
                <div class="spec-title">🎯 Mục Đích Nghiệp Vụ &amp; Production Flow</div>
                <p class="spec-desc">${slide.purpose || slide.description}</p>
                <div style="margin-top:8px;">
                  <span style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">CSDL Liên Kết:</span>
                  <div class="tag-cloud">
                    ${(slide.dbTables || []).map(t => `<span class="db-tag">${t}</span>`).join('')}
                    ${slide.rls ? `<span class="rls-tag">🛡️ ${slide.rls}</span>` : ''}
                  </div>
                </div>
              </div>

              <!-- UI Components -->
              <div class="spec-card">
                <div class="spec-title">🧩 Thành Phần UI &amp; Component Bóc Tách</div>
                <ul class="comp-list">
                  ${(slide.components || []).map(c => `<li>${c}</li>`).join('')}
                </ul>
              </div>

              <!-- Business Rules -->
              ${slide.businessRules ? `
                <div class="spec-card">
                  <div class="spec-title">⚡ Quy Tắc Nghiệp Vụ &amp; Ràng Buộc Dữ Liệu</div>
                  <ul class="rule-list">
                    ${slide.businessRules.map(r => `<li>${r}</li>`).join('')}
                  </ul>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      // Update Notes modal if open
      updateNotesContent(slide);

      // Highlight in Drawer if open
      highlightActiveThumbnail(index);
    }

    function updateNotesContent(slide) {
      notesTitle.textContent = `📝 Ghi chú: ${slide.num} - ${slide.title}`;
      notesContent.innerHTML = `
        <div>
          <strong style="color:#A7F3D0;">Bảng CSDL ánh xạ:</strong>
          <div style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:#FDE68A; margin-top:4px;">
            ${(slide.dbTables || []).join(' · ')}
          </div>
        </div>
        <div>
          <strong style="color:#A7F3D0;">Cơ chế bảo mật RLS / RPC:</strong>
          <div style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:#FDE68A; margin-top:4px;">
            ${slide.rls || 'Chưa thiết lập ràng buộc bổ sung'}
          </div>
        </div>
        <div>
          <strong style="color:#A7F3D0;">Mô tả chi tiết:</strong>
          <div style="margin-top:4px;">
            ${slide.notes || slide.purpose || slide.description || 'Không có ghi chú kỹ thuật bổ sung.'}
          </div>
        </div>
      `;
    }

    function goToSlide(index) {
      renderSlide(index);
      closeGrid();
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        renderSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        renderSlide(currentIndex - 1);
      }
    }

    // Grid Drawer Setup
    function buildGridThumbnails() {
      drawerGridList.innerHTML = slides.map((s, idx) => {
        const imgHtml = s.image
          ? `<img src="anh-giao-dien-du-an/${s.image}" alt="${s.title}" loading="lazy">`
          : `<div style="font-size:32px; color:#6B7280;">${s.isCover ? '🌿' : '📊'}</div>`;

        return `
          <div class="thumb-card ${idx === currentIndex ? 'active' : ''}" data-index="${idx}" data-module="${s.moduleTag}" onclick="goToSlide(${idx})">
            <div class="thumb-img-wrap">
              ${imgHtml}
            </div>
            <div class="thumb-info">
              <div class="thumb-num">${s.num} · ${s.type}</div>
              <div class="thumb-title">${s.title}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function highlightActiveThumbnail(index) {
      const cards = drawerGridList.querySelectorAll('.thumb-card');
      cards.forEach((c, idx) => {
        if (idx === index) {
          c.classList.add('active');
        } else {
          c.classList.remove('active');
        }
      });
    }

    function filterGrid() {
      const query = drawerSearchInput.value.toLowerCase().trim();
      const cards = drawerGridList.querySelectorAll('.thumb-card');

      cards.forEach(card => {
        const idx = parseInt(card.dataset.index, 10);
        const slide = slides[idx];
        const matchModule = (activeFilter === 'all' || slide.moduleTag === activeFilter);
        const matchQuery = !query ||
          slide.title.toLowerCase().includes(query) ||
          slide.num.toLowerCase().includes(query) ||
          (slide.subtitle && slide.subtitle.toLowerCase().includes(query)) ||
          (slide.dbTables && slide.dbTables.some(t => t.toLowerCase().includes(query)));

        if (matchModule && matchQuery) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function openGrid() {
      gridDrawer.classList.add('open');
      drawerSearchInput.focus();
    }

    function closeGrid() {
      gridDrawer.classList.remove('open');
    }

    // Lightbox Modal
    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxModal.classList.add('open');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('open');
      lightboxImg.src = '';
    }

    // Tech Notes Modal
    function toggleNotes() {
      notesModal.classList.toggle('open');
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Event Listeners
    btnNext.addEventListener('click', nextSlide);
    btnPrev.addEventListener('click', prevSlide);
    btnFirst.addEventListener('click', () => renderSlide(0));
    btnLast.addEventListener('click', () => renderSlide(slides.length - 1));

    document.getElementById('progressTrack').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      const targetIdx = Math.floor(ratio * slides.length);
      renderSlide(targetIdx);
    });

    btnToggleGrid.addEventListener('click', openGrid);
    btnCloseGrid.addEventListener('click', closeGrid);

    btnToggleNotes.addEventListener('click', toggleNotes);
    btnCloseNotes.addEventListener('click', () => notesModal.classList.remove('open'));

    btnToggleFullscreen.addEventListener('click', toggleFullscreen);

    btnCloseLightbox.addEventListener('click', closeLightbox);
    lightboxModal.addEventListener('click', (e) => {
      if (e.target === lightboxModal) closeLightbox();
    });

    // Filter Buttons in Grid
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        filterGrid();
      });
    });

    drawerSearchInput.addEventListener('input', filterGrid);

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        if (e.key === 'Escape') {
          e.target.blur();
          closeGrid();
        }
        return;
      }

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        renderSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        renderSlide(slides.length - 1);
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'g' || e.key === 'G' || e.key === 'o' || e.key === 'O') {
        e.preventDefault();
        if (gridDrawer.classList.contains('open')) {
          closeGrid();
        } else {
          openGrid();
        }
      } else if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        toggleNotes();
      } else if (e.key === 'Escape') {
        closeLightbox();
        closeGrid();
        notesModal.classList.remove('open');
      }
    });

    // Init
    buildGridThumbnails();
    renderSlide(0);
  </script>
</body>
</html>
