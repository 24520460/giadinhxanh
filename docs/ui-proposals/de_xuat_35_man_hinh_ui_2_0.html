  <style>
    :root {
      --primary: #0F3826;
      --primary-hover: #092619;
      --primary-surface: #EAF4EE;
      --emerald-vibrant: #10B981;
      --accent-warm: #E07A5F;
      --accent-amber: #F59E0B;
      --accent-flame: #EA580C;
      --text-main: #0F172A;
      --text-body: #334155;
      --text-muted: #64748B;
      --bg-page: #F8FAFC;
      --bg-card: #FFFFFF;
      --border: #E2E8F0;
      --border-subtle: #F1F5F9;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    .topbar {
      height: 64px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }

    .brand-tag {
      background: var(--primary-surface);
      color: #059669;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-input {
      background: #F1F5F9;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      width: 260px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--emerald-vibrant);
      background: #FFFFFF;
    }

    /* Master Layout: Sidebar + Main Content */
    .app-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
      height: calc(100vh - 64px);
    }

    /* Left Sidebar */
    .sidebar {
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-section-title {
      padding: 14px 20px 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      background: #F8FAFC;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .screen-item-btn {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      background: transparent;
      border-left: 3px solid transparent;
      text-align: left;
      transition: all 0.15s;
    }

    .screen-item-btn:hover {
      background: #F8FAFC;
    }

    .screen-item-btn.active {
      background: var(--primary-surface);
      border-left-color: var(--primary);
    }

    .item-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-warm);
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 2px;
      line-height: 1.35;
    }

    .item-badge {
      font-size: 10px;
      font-weight: 700;
      background: #E2E8F0;
      color: #475569;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* Right Main Display Stage */
    .stage {
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: #F8FAFC;
    }

    .stage-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .stage-main-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }

    .stage-meta-badges {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .meta-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    .badge-auth { background: #FEF3C7; color: #92400E; }
    .badge-customer { background: #EAF4EE; color: #0F3826; }
    .badge-provider { background: #E0E7FF; color: #3730A3; }
    .badge-admin { background: #FEE2E2; color: #991B1B; }
    .badge-appendix { background: #F3E8FF; color: #6B21A8; }

    /* Specification Grid below Mockup */
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 24px;
    }

    .spec-box {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .spec-box-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spec-box-text {
      font-size: 13px;
      line-height: 1.6;
      color: #334155;
    }

    .nav-bar-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 16px;
    }

    .nav-btn {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--primary-surface);
      color: var(--primary);
      border-color: #10B981;
    }
  </style>
</head>

    let activeIndex = 0;

    const sidebar = document.getElementById('sidebarList');
    const stage = document.getElementById('mainStage');
    const searchInput = document.getElementById('searchInput');

    // Build Sidebar
    function buildSidebar(filterText = '') {
      sidebar.innerHTML = '';
      let currentModule = '';

      screensData.forEach((s, idx) => {
        if (filterText) {
          const match = s.title.toLowerCase().includes(filterText) ||
                        s.num.toLowerCase().includes(filterText) ||
                        s.module.toLowerCase().includes(filterText) ||
                        s.dbTables.toLowerCase().includes(filterText);
          if (!match) return;
        }

        if (s.module !== currentModule) {
          currentModule = s.module;
          const secTitle = document.createElement('div');
          secTitle.className = 'sidebar-section-title';
          secTitle.textContent = currentModule;
          sidebar.appendChild(secTitle);
        }

        const btn = document.createElement('div');
        btn.className = 'screen-item-btn' + (idx === activeIndex ? ' active' : '');
        btn.onclick = () => selectScreen(idx);
        btn.innerHTML = `
          <div>
            <div class="item-num">MÀN HÌNH ${s.num}</div>
            <div class="item-title">${s.title}</div>
          </div>
          <span class="item-badge">${s.type}</span>
        `;
        sidebar.appendChild(btn);
      });
    }

    // Render Active Screen
    function renderScreen(index) {
      if (index < 0) index = 0;
      if (index >= screensData.length) index = screensData.length - 1;
      activeIndex = index;

      const s = screensData[index];

      stage.innerHTML = `
        <div class="stage-card">
          <div class="stage-header">
            <div>
              <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:700; color:var(--accent-warm);">
                MÀN HÌNH ${s.num} · PHIÊN BẢN ĐỀ XUẤT 2.0
              </div>
              <h2 class="stage-main-title">${s.title}</h2>
              <div class="stage-meta-badges">
                <span class="meta-badge badge-${s.moduleKey}">${s.module}</span>
                <span class="meta-badge" style="background:#F1F5F9; color:#475569;">LOẠI: ${s.type}</span>
                <span class="meta-badge" style="background:#F8FAFC; border:1px solid #E2E8F0; color:#334155;">VAI TRÒ: ${s.role}</span>
              </div>
            </div>
            <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; color:#64748B;">
              ${index + 1} / ${screensData.length}
            </div>
          </div>

          <!-- The Live Redesigned 2.0 Mockup -->
          <div style="background:#F8FAFC; border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; min-height:360px; overflow-x:auto;">
            ${s.mockupHtml}
          </div>

          <!-- Improvements Breakdown -->
          <div class="specs-grid">
            <div class="spec-box">
              <div class="spec-box-title">✂️ Những Gì Đã Lược Bỏ (Anti-Clutter)</div>
              <p class="spec-box-text">${s.removedClutter}</p>
              
              <div class="spec-box-title" style="margin-top:14px;">🔘 Thiết Kế Bo Tròn &amp; Hiện Đại Hóa</div>
              <p class="spec-box-text">${s.keyChanges}</p>
            </div>

            <div class="spec-box">
              <div class="spec-box-title">🗄️ Bảng CSDL PostgreSQL Ánh Xạ</div>
              <p class="spec-box-text" style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:#0F3826; font-weight:700;">
                ${s.dbTables}
              </p>

              <div class="spec-box-title" style="margin-top:14px;">⚡ Logic Nghiệp Vụ &amp; RLS Độc Lập</div>
              <p class="spec-box-text">${s.logic}</p>
            </div>
          </div>

          <!-- Footer Next/Prev -->
          <div class="nav-bar-footer">
            <button class="nav-btn" onclick="prevScreen()" ${index === 0 ? 'disabled style="opacity:0.4"' : ''}>
              ← Màn Hình Trước
            </button>
            <div style="font-size:12px; color:#64748B;">
              Sử dụng phím mũi tên ← → để duyệt nhanh từng màn hình
            </div>
            <button class="nav-btn" onclick="nextScreen()" ${index === screensData.length - 1 ? 'disabled style="opacity:0.4"' : ''}>
              Màn Hình Tiếp Theo →
            </button>
          </div>
        </div>
      `;

      // Highlight in sidebar
      const buttons = sidebar.querySelectorAll('.screen-item-btn');
      buttons.forEach((b, idx) => {
        if (idx === index) b.classList.add('active');
        else b.classList.remove('active');
      });

      stage.scrollTop = 0;
    }

    function selectScreen(index) {
      renderScreen(index);
    }

    function nextScreen() {
      if (activeIndex < screensData.length - 1) {
        renderScreen(activeIndex + 1);
      }
    }

    function prevScreen() {
      if (activeIndex > 0) {
        renderScreen(activeIndex - 1);
      }
    }

    searchInput.addEventListener('input', (e) => {
      const txt = e.target.value.toLowerCase().trim();
      buildSidebar(txt);
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        nextScreen();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevScreen();
      }
    });

    // Init
    buildSidebar();
    renderScreen(0);
  </script>
